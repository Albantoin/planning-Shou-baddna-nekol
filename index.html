<!-- Police : Bricolage Grotesque (titres) + Figtree (texte). Repli sur les polices système si indisponibles. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Applique le thème sombre AVANT le premier affichage pour éviter un flash blanc -->
<script>
  try {
    const t = localStorage.getItem('mealprep.theme');
    if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  } catch (e) { /* stockage indisponible : on garde le thème clair */ }
</script>

<!-- Tailwind CSS via CDN (version figée) -->
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>

        fontFamily: {
          sans: ['Figtree', 'system-ui', '-apple-system', 'Segoe UI', 'Roboto', 'sans-serif'],

<style>
  html { -webkit-tap-highlight-color: transparent; }
  body { font-family: Figtree, system-ui, sans-serif; }
  .font-display { letter-spacing: -0.01em; }
  /* Zone de dépôt survolée pendant un glisser-déposer */
  .drop-hover { outline: 2px solid #2F7D5B; outline-offset: -2px; background-color: rgba(47,125,91,.10) !important; }
  [draggable="true"] { -webkit-user-drag: element; }
  /* Marge de sécurité pour les téléphones à encoche */
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
  details > summary { list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details[open] .chev { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
  /* Apparition du toast (réponse à une action de l'utilisateur) */
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

</style>

  /* ==========================================================================
     3. ÉTAT + PERSISTANCE (localStorage)
     ========================================================================== */
  const clone = o => JSON.parse(JSON.stringify(o));

  function defaultState() {
    return { recipes: clone(DEFAULT_RECIPES), plan: {}, checked: {}, recipesVersion: RECIPES_VERSION };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        const stored = Array.isArray(s.recipes) ? s.recipes : [];
        // Livret mis à jour : on remplace les recettes intégrées et on garde seulement celles créées par l'utilisateur
        const recipes = s.recipesVersion === RECIPES_VERSION
          ? (stored.length ? stored : clone(DEFAULT_RECIPES))
          : [...clone(DEFAULT_RECIPES), ...stored.filter(r => !r.builtin)];
        return {
          recipes,
          plan: s.plan && typeof s.plan === 'object' ? s.plan : {},
          checked: s.checked && typeof s.checked === 'object' ? s.checked : {},
          recipesVersion: RECIPES_VERSION
        };
      }
    } catch (e) { /* données corrompues ou stockage bloqué : on repart de zéro */ }
    return defaultState();
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { toast('Sauvegarde impossible : le stockage du navigateur est désactivé.'); }
  }

  let state = loadState();

  // État de l'interface (non sauvegardé)
  const ui = { tab: 'plan', weekOffset: 0, search: '', filter: 'all', modal: null };

  /* ==========================================================================
     4. UTILITAIRES
     ========================================================================== */
  const $ = sel => document.querySelector(sel);
  const uid = () => 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  // Normalise un texte pour comparer sans tenir compte des accents / majuscules / œ
  const norm = s => String(s || '').toLowerCase().replace(/œ/g, 'oe').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : s;
  const recipeById = id => state.recipes.find(r => r.id === id);

  // --- Dates : une semaine = lundi → dimanche, identifiée par la date de son lundi
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  function mondayOf(date) {
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
    return d;
  }
  function currentWeek() {
    const start = addDays(mondayOf(new Date()), ui.weekOffset * 7);
    return { start, key: iso(start) };
  }
  const fmtDate = (d, opts) => d.toLocaleDateString('fr-FR', opts);
  function weekLabel(start) {
    return `${fmtDate(start, { day: 'numeric', month: 'long' })} au ${fmtDate(addDays(start, 6), { day: 'numeric', month: 'long', year: 'numeric' })}`;
  }
  function getWeekPlan(key, create = false) {
    if (!state.plan[key]) { if (!create) return {}; state.plan[key] = {}; }
    return state.plan[key];
  }

  // --- Quantités : conversion vers une unité de base pour pouvoir additionner
  function normalizeUnit(qty, unit) {
    if (unit === 'kg') return [qty * 1000, 'g'];
    if (unit === 'l')  return [qty * 1000, 'ml'];
    if (unit === 'cl') return [qty * 10, 'ml'];
    return [qty, unit];
  }
  const nf = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 2 });
  function fmtAmount(qty, unit) {
    if (unit === 'g' && qty >= 1000) return `${nf.format(qty / 1000)} kg`;
    if (unit === 'ml' && qty >= 1000) return `${nf.format(qty / 1000)} L`;
    const label = qty > 1 && UNIT_PLURAL[unit] ? UNIT_PLURAL[unit] : unit;
    return `${nf.format(qty)}${label ? ' ' + label : ''}`;
  }

  // --- Petit message temporaire
  let toastTimer;
  function toast(msg) {
    const el = $('#toast');
    el.innerHTML = `<div class="toast-in rounded-full bg-ink-900 text-white dark:bg-white dark:text-ink-900 px-4 py-2 text-sm font-medium shadow-lg">${esc(msg)}</div>`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.innerHTML = ''; }, 2300);
  }

  /* ==========================================================================
     6. LOGIQUE MÉTIER
     ========================================================================== */

  /** Liste des repas planifiés d'une semaine, triés par jour puis créneau. */
  function planEntries(weekKey) {
    const plan = state.plan[weekKey] || {};
    return Object.entries(plan).map(([key, e]) => {
      const [day, slot] = key.split('-');
      return { key, day: Number(day), slot, p: e.p || 1, r: recipeById(e.rid) };
    }).filter(x => x.r)
      .sort((a, b) => a.day - b.day || SLOT_IDS.indexOf(a.slot) - SLOT_IDS.indexOf(b.slot));
  }

  /** Liste de courses : additionne les ingrédients identiques (même nom + même unité de base). */
  function buildShopping(weekKey) {
    const map = new Map();
    for (const en of planEntries(weekKey)) {
      for (const ing of en.r.ings) {
        const [q, u] = normalizeUnit(Number(ing.qty) || 0, ing.unit);
        const key = `${norm(ing.name)}|${u}`;
        const item = map.get(key) || { key, name: cap(ing.name.trim()), unit: u, aisle: ing.aisle || 'Autre', qty: 0 };
        item.qty += q * en.p;
        map.set(key, item);
      }
    }
    const groups = {};
    for (const it of map.values()) {
      const aisle = AISLES.includes(it.aisle) ? it.aisle : 'Autre';
      (groups[aisle] = groups[aisle] || []).push(it);
    }
    for (const a in groups) groups[a].sort((x, y) => x.name.localeCompare(y.name, 'fr'));
    return groups;
  }

      kw: ["flocons d'avoine"], min: 2,
      step: 'Monter les bocaux de petit-déjeuner (flocons, lait, yaourt) et les ranger au frais.',
      advice: c => `${c.hits.length} petits-déjeuners utilisent des flocons d’avoine. Préparer les bocaux d’overnight oats pour 3 jours (au-delà, la texture se dégrade) et ajouter fruits et graines au moment de manger.`
    },
    {
      id: 'fish', order: 0, icon: '🐟', title: 'Poisson frais : à placer en début de semaine',
      kw: ['saumon'], min: 1,
      advice: c => `Le poisson frais se garde 1 à 2 jours au frigo. Le planifier le lundi ou le mardi, ou le congeler le jour de l’achat et le décongeler la veille au réfrigérateur. Concerné : ${c.hits.map(h => `${DAYS[h.day].toLowerCase()} (${slotById(h.slot).short.toLowerCase()})`).join(', ')}.`
    }
  ];

  function analyzePrep(entries) {
    const out = [];
    for (const rule of PREP_RULES) {
      const hits = [];
      let total = 0;
      for (const en of entries) {
        const matched = en.r.ings.filter(i => rule.kw.some(k => norm(i.name).includes(norm(k))));
        if (!matched.length) continue;
        hits.push(en);
        if (rule.unit) {
          for (const m of matched) {
            const [q, u] = normalizeUnit(Number(m.qty) || 0, m.unit);
            if (u === rule.unit) total += q * en.p;
          }
        }
      }
      if (hits.length >= (rule.min || 2)) out.push({ rule, hits, total });
    }
    return out;
  }

  /* ==========================================================================
     7. ACTIONS (modifient l'état puis re-rendent)
     ========================================================================== */
  function setMeal(key, rid, portions) {
    const plan = getWeekPlan(currentWeek().key, true);
    plan[key] = { rid, p: portions || (plan[key] && plan[key].p) || 1 };
    saveState();
  }

  function removeRecipe(rid) {
    state.recipes = state.recipes.filter(r => r.id !== rid);
    // Retire la recette de toutes les semaines planifiées
    for (const wk of Object.keys(state.plan)) {
      for (const k of Object.keys(state.plan[wk])) if (state.plan[wk][k].rid === rid) delete state.plan[wk][k];
    }
    saveState();
  }

  /* ---------- Vue : Guide Meal Prep ---------- */
  function viewPrep() {
    const { start, key: wk } = currentWeek();
    const entries = planEntries(wk);
    const header = `
    <div class="mb-5 flex flex-wrap items-center gap-3">
      <div class="flex items-center gap-1">
        <button data-action="week-prev" class="${btnIcon} h-10 w-10 border border-stone-300 dark:border-white/15" aria-label="Semaine précédente">${I.left}</button>
        <button data-action="week-next" class="${btnIcon} h-10 w-10 border border-stone-300 dark:border-white/15" aria-label="Semaine suivante">${I.right}</button>
      </div>
      <div>
        <h1 class="font-display text-2xl font-bold leading-tight">Guide meal prep</h1>
        <p class="text-sm text-stone-500 dark:text-stone-400">Semaine du ${esc(weekLabel(start))}</p>
      </div>
    </div>`;

    if (!entries.length) {
      return header + `
      <div class="${card} p-10 text-center">
        <p class="text-4xl" aria-hidden="true">🍱</p>
        <p class="mt-3 font-display text-lg font-bold">Rien à préparer pour l'instant</p>
        <p class="mt-1 text-sm text-stone-500 dark:text-stone-400">Planifier au moins deux repas : le guide repère ce qui peut se cuisiner en même temps.</p>
        <button data-action="tab" data-tab="plan" class="${btnPrimary} mt-5">Aller au planning</button>
      </div>`;
    }

    const results = analyzePrep(entries);
    const portions = entries.reduce((n, e) => n + e.p, 0);
    const distinct = Object.values(buildShopping(wk)).flat().length;

    const stats = `
    <div class="mb-5 grid grid-cols-3 gap-3">
      ${[[entries.length, 'repas'], [portions, 'portions'], [distinct, 'articles à acheter']].map(([n, l]) => `
        <div class="${card} p-4"><p class="font-display text-3xl font-extrabold text-leaf-600 dark:text-leaf-200">${n}</p><p class="text-sm text-stone-500 dark:text-stone-400">${l}</p></div>`).join('')}
    </div>`;

    const cards = results.map(({ rule, hits, total }) => `
      <article class="${card} p-4">
        <h3 class="flex items-center gap-2 font-display text-lg font-bold"><span aria-hidden="true">${rule.icon}</span>${rule.title}</h3>
        <p class="mt-2 text-sm leading-relaxed">${esc(rule.advice({ hits, total }))}</p>
        <ul class="mt-3 flex flex-wrap gap-1.5">
          ${hits.map(h => `<li class="rounded-full px-2.5 py-1 text-xs font-medium ${TONE[h.slot].chip}">${DAYS[h.day].slice(0, 3)}. ${esc(h.r.title)}</li>`).join('')}
        </ul>
      </article>`).join('');

    // Déroulé de la session : uniquement les étapes utiles, dans l'ordre de cuisson
    const steps = results.filter(x => x.rule.order > 0).sort((a, b) => a.rule.order - b.rule.order).map(x => x.rule.step);
    if (steps.length) steps.push('Laisser refroidir (moins de 2 h à température ambiante), puis portionner dans des boîtes étiquetées avec le nom du plat et la date.');
    const timeline = steps.length ? `
      <section class="${card} p-4 lg:sticky lg:top-20">
        <h2 class="font-display text-lg font-bold">Déroulé conseillé de la session</h2>
        <p class="mb-3 text-sm text-stone-500 dark:text-stone-400">Environ 2 h le dimanche, dans cet ordre pour que tout cuise en parallèle.</p>
        <ol class="space-y-3">
          ${steps.map((s, i) => `<li class="flex gap-3"><span class="flex h-6 w-6 shrink-0 items-center justify-center rounded-full bg-leaf-100 text-xs font-bold text-leaf-700 dark:bg-leaf-400/15 dark:text-leaf-200">${i + 1}</span><span class="text-sm leading-relaxed">${esc(s)}</span></li>`).join('')}
        </ol>
      </section>` : '';

    // Repas de fin de semaine contenant de la viande ou du poisson : à congeler
    const toFreeze = entries.filter(e => e.day >= 3 && e.r.ings.some(i => i.aisle === VP));
    const freeze = toFreeze.length ? `
      <article class="${card} border-sky-200 p-4 dark:border-sky-400/30">
        <h3 class="flex items-center gap-2 font-display text-lg font-bold"><span aria-hidden="true">🧊</span>À congeler après cuisson</h3>
        <p class="mt-2 text-sm leading-relaxed">Ces repas tombent à partir de jeudi : viande et poisson cuits ne tiennent que 3 à 4 jours au frigo. Les congeler en portions individuelles et les sortir la veille.</p>
        <ul class="mt-3 flex flex-wrap gap-1.5">${toFreeze.map(h => `<li class="rounded-full px-2.5 py-1 text-xs font-medium ${TONE[h.slot].chip}">${DAYS[h.day].slice(0, 3)}. ${esc(h.r.title)}</li>`).join('')}</ul>
      </article>` : '';

    const empty = !results.length && !freeze ? `
      <div class="${card} p-6"><p class="font-semibold">Peu de recoupements cette semaine</p>
      <p class="mt-1 text-sm text-stone-500 dark:text-stone-400">Les repas planifiés n'ont pas assez d'ingrédients en commun. Ajouter d'autres plats à base de riz, de poulet ou de légumes rôtis pour regrouper les cuissons.</p></div>` : '';

    const rules = `
      <section class="${card} p-4">
        <h2 class="font-display text-lg font-bold">Conservation en bref</h2>
        <ul class="mt-2 space-y-1.5 text-sm leading-relaxed">
          <li>Plats cuisinés : 3 à 4 jours au réfrigérateur (4 °C maximum).</li>
          <li>Refroidir vite : étaler en couche fine, au frigo en moins de 2 h.</li>
          <li>Étiqueter chaque boîte avec le plat et la date de préparation.</li>
          <li>Congélation : jusqu'à 3 mois, décongélation au réfrigérateur la veille.</li>
          <li>Garder séparés les éléments croquants, les sauces et les herbes fraîches, à ajouter au dernier moment.</li>
        </ul>
      </section>`;

    return `${header}${stats}
    <div class="grid items-start gap-5 lg:grid-cols-[minmax(0,1fr)_22rem]">
      <div class="grid gap-4 md:grid-cols-2 lg:grid-cols-1 xl:grid-cols-2">${cards}${freeze}${empty}</div>
      <div class="space-y-4">${timeline}${rules}</div>
    </div>`;
  }

  /* ==========================================================================
     9. RENDU PRINCIPAL
     ========================================================================== */
  function render() {
    // Sauvegarde le focus (champ de recherche) et le scroll de la colonne latérale
    const active = document.activeElement;
    const focusId = active && active.id;
    const caret = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    const side = $('#side-scroll');
    const sideTop = side ? side.scrollTop : 0;

    const views = { plan: viewPlan, recipes: viewRecipes, shop: viewShop, prep: viewPrep };
    $('#app').innerHTML = `
      ${renderHeader()}
      <main class="mx-auto max-w-7xl px-4 pb-28 pt-5 sm:px-6 md:pb-12">
        ${views[ui.tab]()}
        <footer class="mt-12 flex flex-wrap items-center justify-between gap-3 border-t border-stone-200 pt-5 text-xs text-stone-500 dark:border-white/10 dark:text-stone-400">
          <span>Les données restent dans ce navigateur (localStorage). Rien n'est envoyé en ligne.</span>
          <button data-action="reset-all" class="underline underline-offset-2 hover:text-ink-800 dark:hover:text-white">Réinitialiser toutes les données</button>
        </footer>
      </main>
      ${renderBottomNav()}`;

    const newSide = $('#side-scroll');
    if (newSide) newSide.scrollTop = sideTop;
    if (focusId) {
      const el = document.getElementById(focusId);
      if (el) { el.focus(); if (caret !== null) try { el.setSelectionRange(caret, caret); } catch (e) {} }
    }
  }

  /* ==========================================================================
     10. MODALES
     ========================================================================== */
  function modalShell(title, body) {
    return `
    <div class="fixed inset-0 z-50 flex items-end justify-center sm:items-center">
      <div data-action="close-modal" class="absolute inset-0 bg-ink-950/60 backdrop-blur-sm"></div>
      <div role="dialog" aria-modal="true" aria-label="${esc(title)}" class="safe-bottom relative flex max-h-[92vh] w-full flex-col rounded-t-3xl bg-white shadow-2xl sm:max-w-xl sm:rounded-3xl dark:bg-ink-900">
        <div class="flex items-center justify-between px-5 pb-2 pt-5">
          <h2 class="font-display text-xl font-bold">${esc(title)}</h2>
          <button data-action="close-modal" class="${btnIcon}" aria-label="Fermer">${I.x}</button>
        </div>
        <div class="overflow-y-auto px-5 pb-5">${body}</div>
      </div>
    </div>`;
  }

  const fieldCls = 'w-full rounded-xl border border-stone-300 bg-white px-3 py-2.5 text-sm focus:border-leaf-500 focus:outline-none focus:ring-2 focus:ring-leaf-500/30 dark:border-white/15 dark:bg-ink-800';
  const opts = (list, sel) => list.map(v => `<option value="${esc(v)}" ${v === sel ? 'selected' : ''}>${esc(v)}</option>`).join('');

  function ingRow(ing = {}) {
    return `
    <div class="ing-row grid grid-cols-[1fr_auto] gap-2 rounded-xl border border-stone-200 p-2.5 dark:border-white/10">
      <input class="ing-name ${fieldCls}" placeholder="Ingrédient (ex. Riz basmati)" value="${esc(ing.name || '')}" aria-label="Nom de l'ingrédient">
      <button type="button" data-action="remove-ing-row" class="${btnIcon} h-10 w-10" aria-label="Supprimer cet ingrédient">${I.x}</button>
      <div class="col-span-2 grid grid-cols-[5rem_1fr_1fr] gap-2">
        <input class="ing-qty ${fieldCls}" type="number" min="0" step="any" inputmode="decimal" placeholder="Qté" value="${ing.qty ?? ''}" aria-label="Quantité">
        <select class="ing-unit ${fieldCls}" aria-label="Unité">${opts(UNITS, ing.unit || 'g')}</select>
        <select class="ing-aisle ${fieldCls}" aria-label="Rayon">${opts(AISLES, ing.aisle || 'Épicerie')}</select>
      </div>
    </div>`;
  }

  function modalRecipeForm() {
    return modalShell('Nouvelle recette', `
      <div class="space-y-4">
        <div>
          <label for="rf-title" class="mb-1 block text-sm font-semibold">Nom de la recette</label>
          <input id="rf-title" class="${fieldCls}" placeholder="Ex. Bowl de patate douce et houmous" autocomplete="off">
        </div>
        <div>
          <label for="rf-cat" class="mb-1 block text-sm font-semibold">Catégorie</label>
          <select id="rf-cat" class="${fieldCls}">${SLOTS.map(s => `<option value="${s.id}">${s.icon} ${s.label}</option>`).join('')}</select>
        </div>
        <div>
          <p class="mb-1 text-sm font-semibold">Ingrédients pour 1 portion</p>
          <div id="rf-ings" class="space-y-2">${ingRow()}${ingRow()}</div>
          <button type="button" data-action="add-ing-row" class="${btnGhost} mt-2 w-full">${I.plus} Ajouter un ingrédient</button>
        </div>
        <p id="rf-error" class="hidden rounded-xl bg-red-50 px-3 py-2 text-sm text-red-700 dark:bg-red-500/10 dark:text-red-300" role="alert"></p>
        <button type="button" data-action="save-recipe" class="${btnPrimary} w-full">Enregistrer la recette</button>
      </div>`);
  }

  /** Choix du jour / créneau pour une recette donnée (bouton « Ajouter au planning »). */
  function modalSlotChooser(rid) {
    const r = recipeById(rid);
    if (!r) return '';
    const { start, key: wk } = currentWeek();
    const plan = getWeekPlan(wk);
    // Pré-sélectionne le premier jour dont le créneau de cette catégorie est libre
    let defDay = DAYS.findIndex((_, d) => !plan[`${d}-${r.cat}`]);
    if (defDay < 0) defDay = 0;
    return modalShell('Ajouter au planning', `
      <p class="mb-4 text-sm text-stone-600 dark:text-stone-300"><strong>${esc(r.title)}</strong><br>Semaine du ${esc(weekLabel(start))}</p>
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label for="sc-day" class="mb-1 block text-sm font-semibold">Jour</label>
            <select id="sc-day" class="${fieldCls}">
              ${DAYS.map((n, d) => `<option value="${d}" ${d === defDay ? 'selected' : ''}>${n} ${addDays(start, d).getDate()}</option>`).join('')}
            </select>
          </div>
          <div>
            <label for="sc-slot" class="mb-1 block text-sm font-semibold">Créneau</label>
            <select id="sc-slot" class="${fieldCls}">
              ${SLOTS.map(s => `<option value="${s.id}" ${s.id === r.cat ? 'selected' : ''}>${s.short}</option>`).join('')}
            </select>
          </div>
        </div>
        <div>
          <label for="sc-portions" class="mb-1 block text-sm font-semibold">Portions</label>
          <input id="sc-portions" type="number" min="1" max="20" value="1" class="${fieldCls}">
          <p class="mt-1 text-xs text-stone-500 dark:text-stone-400">Pour cuisiner en lot, augmenter le nombre de portions : la liste de courses suit.</p>
        </div>
        <button type="button" data-action="confirm-add" data-rid="${r.id}" class="${btnPrimary} w-full">Ajouter</button>
      </div>`);
  }

  /** Choix d'une recette pour un créneau vide ou à remplacer. */
  function modalPicker(key, all) {
    const [d, slotId] = key.split('-');
    const slot = slotById(slotId);
    const list = state.recipes
      .filter(r => all || r.cat === slotId)
      .sort((a, b) => SLOT_IDS.indexOf(a.cat) - SLOT_IDS.indexOf(b.cat) || a.title.localeCompare(b.title, 'fr'));
    return modalShell(`${DAYS[Number(d)]}, ${slot.short.toLowerCase()}`, `
      <div class="space-y-2">
        ${list.length ? list.map(r => `
          <button data-action="choose-recipe" data-rid="${r.id}" data-key="${key}" class="flex w-full items-center gap-3 rounded-xl border border-stone-200 p-3 text-left hover:border-leaf-500 hover:bg-leaf-50 dark:border-white/10 dark:hover:bg-leaf-400/10">
            <span class="text-xl" aria-hidden="true">${slotById(r.cat).icon}</span>
            <span class="min-w-0 flex-1"><span class="block text-sm font-semibold">${esc(r.title)}</span>
            <span class="block text-xs text-stone-500 dark:text-stone-400">${r.ings.length} ingrédients</span></span>
          </button>`).join('') : '<p class="py-6 text-center text-sm text-stone-500">Aucune recette dans cette catégorie.</p>'}
      </div>
      <div class="mt-4 flex flex-wrap gap-2">
        <button data-action="picker-toggle" class="${btnGhost}">${all ? `Afficher seulement « ${slot.short} »` : 'Afficher toutes les catégories'}</button>
        <button data-action="new-recipe" class="${btnGhost}">${I.plus} Nouvelle recette</button>
      </div>`);
  }

  function renderModal() {
    const m = ui.modal;
    let html = '';
    if (m) {
      if (m.type === 'recipe-form') html = modalRecipeForm();
      else if (m.type === 'slot-chooser') html = modalSlotChooser(m.rid);
      else if (m.type === 'picker') html = modalPicker(m.key, m.all);
    }
    $('#modal').innerHTML = html;
    document.body.style.overflow = html ? 'hidden' : '';
    if (html) {
      const first = $('#modal input, #modal select, #modal button[data-action="choose-recipe"]');
      if (first && m.type !== 'picker') first.focus();
    }
  }
  const openModal = m => { ui.modal = m; renderModal(); };
  const closeModal = () => { ui.modal = null; renderModal(); };

  /* ==========================================================================
     11. ÉVÉNEMENTS (délégation : un seul écouteur par type d'événement)
     ========================================================================== */
  const ACTIONS = {
    'tab': el => { ui.tab = el.dataset.tab; render(); window.scrollTo({ top: 0 }); },
    'toggle-theme': () => {
      const dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem(THEME_KEY, dark ? 'dark' : 'light'); } catch (e) {}
      render();
    },
    'filter': el => { ui.filter = el.dataset.cat; render(); },

    // Navigation entre semaines
    'week-prev':  () => { ui.weekOffset--; render(); },
    'week-next':  () => { ui.weekOffset++; render(); },
    'week-today': () => { ui.weekOffset = 0; render(); },
    'clear-week': () => {
      const { key } = currentWeek();
      if (!confirm('Vider tous les repas de cette semaine ?')) return;
      delete state.plan[key]; delete state.checked[key];
      saveState(); render();
    },

    // Planning
    'pick-slot': el => openModal({ type: 'picker', key: el.dataset.key, all: false }),
    'picker-toggle': () => { ui.modal.all = !ui.modal.all; renderModal(); },
    'choose-recipe': el => {
      setMeal(el.dataset.key, el.dataset.rid);
      closeModal(); render();
    },
    'portion': el => {
      const plan = getWeekPlan(currentWeek().key), e = plan[el.dataset.key];
      if (!e) return;
      e.p = Math.min(20, Math.max(1, (e.p || 1) + Number(el.dataset.delta)));
      saveState(); render();
    },
    'slot-remove': el => {
      delete getWeekPlan(currentWeek().key)[el.dataset.key];
      saveState(); render();
    },
    'add-to-plan': el => openModal({ type: 'slot-chooser', rid: el.dataset.rid }),
    'confirm-add': el => {
      const day = $('#sc-day').value, slot = $('#sc-slot').value;
      const p = Math.min(20, Math.max(1, parseInt($('#sc-portions').value, 10) || 1));
      const key = `${day}-${slot}`;
      const existing = getWeekPlan(currentWeek().key)[key];
      if (existing && existing.rid !== el.dataset.rid && !confirm('Ce créneau contient déjà un repas. Le remplacer ?')) return;
      setMeal(key, el.dataset.rid, p);
      closeModal(); render();
      toast(`Ajouté : ${DAYS[Number(day)]}, ${slotById(slot).short.toLowerCase()}`);
    },

    // Recettes
    'new-recipe': () => openModal({ type: 'recipe-form' }),
    'add-ing-row': () => {
      $('#rf-ings').insertAdjacentHTML('beforeend', ingRow());
      const rows = document.querySelectorAll('#rf-ings .ing-name');
      rows[rows.length - 1].focus();
    },
    'remove-ing-row': el => {
      const rows = document.querySelectorAll('#rf-ings .ing-row');
      if (rows.length > 1) el.closest('.ing-row').remove();
      else el.closest('.ing-row').querySelectorAll('input').forEach(i => { i.value = ''; });
    },
    'save-recipe': () => {
      const title = $('#rf-title').value.trim();
      const cat = $('#rf-cat').value;
      const ings = [...document.querySelectorAll('#rf-ings .ing-row')].map(row => ({
        name: row.querySelector('.ing-name').value.trim(),
        qty: parseFloat(String(row.querySelector('.ing-qty').value).replace(',', '.')),
        unit: row.querySelector('.ing-unit').value,
        aisle: row.querySelector('.ing-aisle').value
      })).filter(i => i.name || !isNaN(i.qty));
      const err = $('#rf-error');
      const fail = msg => { err.textContent = msg; err.classList.remove('hidden'); };
      if (!title) return fail('Donner un nom à la recette.');
      if (!ings.length) return fail('Ajouter au moins un ingrédient.');
      if (ings.some(i => !i.name)) return fail('Un ingrédient n\'a pas de nom.');
      if (ings.some(i => isNaN(i.qty) || i.qty <= 0)) return fail('Chaque ingrédient doit avoir une quantité supérieure à 0.');
      const recipe = { id: uid(), title, cat, ings };
      state.recipes.push(recipe);
      saveState();
      // Si la modale avait été ouverte depuis un créneau, on y place directement la recette
      closeModal(); render();
      toast(`Recette « ${title} » enregistrée`);
    },
    'delete-recipe': el => {
      const r = recipeById(el.dataset.rid);
      if (!r) return;
      if (!confirm(`Supprimer « ${r.title} » ? Elle sera aussi retirée du planning.`)) return;
      removeRecipe(r.id); render();
    },

    // Courses
    'uncheck-all': () => { delete state.checked[currentWeek().key]; saveState(); render(); },
    'copy-list': () => {
      const { key } = currentWeek();
      const groups = buildShopping(key), checked = state.checked[key] || {};
      const lines = [];
      for (const a of AISLES) {
        const items = (groups[a] || []).filter(i => !checked[i.key]);
        if (!items.length) continue;
        lines.push(a, ...items.map(i => `- ${i.name} : ${fmtAmount(Math.round(i.qty * 100) / 100, i.unit)}`), '');
      }
      const text = lines.join('\n').trim();
      if (!text) return toast('Tout est déjà dans le panier');
      (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject())
        .then(() => toast('Liste copiée'))
        .catch(() => toast('Copie impossible depuis ce navigateur'));
    },

    // Divers
    'close-modal': () => closeModal(),
    'reset-all': () => {
      if (!confirm('Effacer toutes les données (recettes ajoutées, planning, courses cochées) et revenir à l\'état initial ?')) return;
      state = defaultState(); saveState(); ui.weekOffset = 0; render(); toast('Données réinitialisées');
    }
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const fn = ACTIONS[el.dataset.action];
    if (fn) fn(el, e);
  });

  // Recherche : on filtre à la frappe sans perdre le focus (voir render())
  document.addEventListener('input', e => {
    if (e.target.id === 'search') { ui.search = e.target.value; render(); }
  });

  // Cases à cocher de la liste de courses
  document.addEventListener('change', e => {
    const cb = e.target.closest('[data-check]');
    if (!cb) return;
    const { key } = currentWeek();
    state.checked[key] = state.checked[key] || {};
    if (cb.checked) state.checked[key][cb.dataset.check] = true; else delete state.checked[key][cb.dataset.check];
    saveState(); render();
  });

  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.modal) closeModal(); });

  /* ---------- Glisser-déposer ----------
     - depuis une recette  → copie dans un créneau
     - depuis un créneau   → déplace (ou échange) vers un autre créneau
     Sur mobile, le glisser-déposer tactile n'est pas supporté par les navigateurs :
     les boutons « + » / « Ajouter un repas » jouent le même rôle. */
  document.addEventListener('dragstart', e => {
    if (!(e.target instanceof Element)) return;
    const rec = e.target.closest('[data-drag-recipe]');
    const slot = e.target.closest('[data-drag-slot]');
    if (rec) { e.dataTransfer.setData('text/plain', 'recipe:' + rec.dataset.dragRecipe); e.dataTransfer.effectAllowed = 'copy'; }
    else if (slot) { e.dataTransfer.setData('text/plain', 'slot:' + slot.dataset.dragSlot); e.dataTransfer.effectAllowed = 'move'; }
  });
  document.addEventListener('dragover', e => {
    if (!(e.target instanceof Element)) return;
    const cell = e.target.closest('[data-drop]');
    if (!cell) return;
    e.preventDefault();
    cell.classList.add('drop-hover');
  });
  document.addEventListener('dragleave', e => {
    if (!(e.target instanceof Element)) return;
    const cell = e.target.closest('[data-drop]');
    if (cell && !cell.contains(e.relatedTarget)) cell.classList.remove('drop-hover');
  });
  document.addEventListener('dragend', () => {
    document.querySelectorAll('.drop-hover').forEach(c => c.classList.remove('drop-hover'));
  });
  document.addEventListener('drop', e => {
    if (!(e.target instanceof Element)) return;
    const cell = e.target.closest('[data-drop]');
    if (!cell) return;
    e.preventDefault();
    document.querySelectorAll('.drop-hover').forEach(c => c.classList.remove('drop-hover'));
    const data = e.dataTransfer.getData('text/plain') || '';
    const to = cell.dataset.drop;
    const plan = getWeekPlan(currentWeek().key, true);
    if (data.startsWith('recipe:')) {
      if (!recipeById(data.slice(7))) return;
      setMeal(to, data.slice(7));
    } else if (data.startsWith('slot:')) {
      const from = data.slice(5);
      if (from === to || !plan[from]) return;
      const moved = plan[from], target = plan[to];
      plan[to] = moved;
      if (target) plan[from] = target; else delete plan[from];
      saveState();
    } else return;
    render();
  });

  /* ==========================================================================
     12. DÉMARRAGE
     ========================================================================== */
  render();
})();
</script>
</body>
</html>
